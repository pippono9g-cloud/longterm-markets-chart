<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stocks, Bonds &amp; Cash Since 1957</title>
<style>
  /* House theme — matches the Thailand Fund Risk-Return / Fund-flow / Performance dashboards */
  :root{
    --scb:#4F2D7F; --scb-l:#EFE9F7; --scb-d:#3a2160;
    --ground:#ffffff; --panel:#ffffff;
    --ink:#1a1a1a; --ink-soft:#4d4d4d; --ink-mute:#666666;
    --grid:#e5e5e5; --hair:#cccccc; --soft:#f2f2f2;
    --eq:#4F2D7F; --eq-fill:#4F2D7F; --bond:#B45309; --cash:#007BB0;
    --shock:#b91c1c; --policy:#475569; --milestone:#047857;
    --halo:#ffffff;
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);margin:0;
    font-family:Arial,Helvetica,"Segoe UI","Noto Sans Thai",sans-serif;
    font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1500px;margin:0 auto;padding:24px 24px 52px}
  .title-bar{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
    padding:14px 16px 12px;border-radius:12px;margin-bottom:16px;
    background:linear-gradient(135deg,var(--scb-l) 0%,#fff 55%);
    border:1px solid #e8dff5;border-bottom:2px solid var(--scb)}
  .arrow{flex:none;margin-top:6px;width:0;height:0;
    border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:13px solid var(--scb)}
  .tt{flex:1;min-width:260px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);margin:0 0 4px}
  h1{font-size:24px;font-weight:700;letter-spacing:-.005em;margin:0}
  .sub{font-size:13px;font-weight:700;color:var(--scb);margin:4px 0 0}
  .tag{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;
    font-size:11px;font-weight:700;letter-spacing:.04em;flex:none;margin-top:3px}
  .tag span{padding:4px 12px;border-right:1px solid var(--ink);background:#fff;white-space:nowrap}
  .tag span:last-child{border-right:none}
  .card{border:1px solid var(--hair);border-radius:12px;padding:16px 18px 18px;
    box-shadow:0 1px 3px rgba(79,45,127,.06)}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 4px}
  .controls .lbl{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-mute);margin-right:2px}
  .tf-btn{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-soft);background:#fff;
    border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;transition:.12s}
  .tf-btn:hover{background:var(--soft);color:var(--ink)}
  .tf-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .tf-btn:focus-visible{outline:2px solid var(--scb);outline-offset:2px}
  .tf-btn:disabled{opacity:.38;cursor:not-allowed}
  .tf-btn.switch{padding:3px 4px;display:inline-flex;gap:3px;align-items:center;background:var(--soft);border-color:var(--ink)}
  .tf-btn.switch b,.tf-btn.switch span{padding:3px 11px;border-radius:999px;font-size:12.5px;line-height:1.35;font-weight:700}
  .tf-btn.switch b{background:var(--ink);color:#fff}
  .tf-btn.switch span{color:var(--ink-mute);font-weight:600}
  figure{margin:12px 0 0;position:relative}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y;cursor:crosshair;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  svg.dragging{cursor:grabbing}
  .chart-scroll{overflow-x:hidden}
  .foot{margin:14px 0 0;font-size:11.5px;line-height:1.55;color:var(--ink-mute);border-top:1px solid var(--hair);padding-top:11px}
  .foot strong{color:var(--ink-soft);font-weight:700}
  text{font-family:Arial,Helvetica,"Noto Sans Thai",sans-serif}
  .ax{fill:var(--ink-mute);font-size:12px;font-weight:400}
  .ax-strong{fill:var(--ink-soft);font-size:12px;font-weight:700}
  .gridline{stroke:var(--grid);stroke-width:1}
  .gridline.minor{stroke-dasharray:2 3;opacity:.6}
  .baseline{stroke:var(--ink-soft);stroke-width:1.4}
  .evt-label{fill:var(--ink);font-size:12px;font-weight:700}
  .evt-date{fill:var(--ink-mute);font-size:11px;font-weight:400}
  .series-end{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .cross{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3;opacity:.75}
</style>
</head>

<div class="wrap">
  <div class="title-bar">
    <span class="arrow"></span>
    <div class="tt">
      <p class="eyebrow">1957 &ndash; 2026 &nbsp;&bull;&nbsp; U.S. dollars &nbsp;&bull;&nbsp; growth of a single $10,000 investment</p>
      <h1>Stocks, bonds &amp; cash over the long run</h1>
      <p class="sub" id="sub">$10,000 invested when the S&amp;P 500 began in 1957, held through every crisis since</p>
    </div>
    <span class="tag"><span>Ratio scale</span><span>Illustrative</span></span>
  </div>

  <div class="card">
    <div class="controls" id="controls">
      <span class="lbl">Time frame</span>
    </div>

    <figure>
      <div class="chart-scroll">
        <svg id="chart" viewBox="0 0 1760 780" role="img"
             aria-label="Interactive logarithmic chart of $10,000 invested in U.S. stocks, bonds and cash since 1957, with adjustable time frame and event annotations that reveal more detail when zoomed in."></svg>
      </div>
    </figure>

    <p class="foot" id="foot"></p>
  </div>
</div>

  function iconSVG(name,color,cx,cy){

  }

  /* ============ SERIES (built from the monthly data) =========
     Stocks : price index rebased to $10,000 at year-end 1957.
     Cash   : 3-month T-bill, compounded monthly (prior month's rate).
     Bonds  : investment-grade proxy modelled from the 10-year yield:
              monthly total return = y0/12 + carry + DUR*(y0 - y1),
              DUR 7yr, carry ~0.6%/yr (credit spread + roll-down the
              Aggregate earns over Treasuries). Tracks real rate moves,
              including the ~-11% draw-down in 2022. */
  var DUR = 7.0, CARRY = 0.006/12;
  var times = M.map(function(r){return r[0];});
  var EQ=[BASE], BO=[BASE], CA=[BASE];
  for(var i=1;i<M.length;i++){
    EQ.push(BASE * M[i][1] / M[0][1]);
    var y0=M[i-1][3]/100, y1=M[i][3]/100;
    BO.push(BO[i-1] * (1 + y0/12 + CARRY + DUR*(y0-y1)));
    CA.push(CA[i-1] * Math.pow(1 + M[i-1][2]/100, 1/12));
  }

  function idxAt(t){ // nearest sample index for a decimal year
    var lo=0,hi=times.length-1;
    while(lo<hi){var m=(lo+hi)>>1; if(times[m]<t)lo=m+1; else hi=m;}
    if(lo>0 && Math.abs(times[lo-1]-t)<Math.abs(times[lo]-t))lo--;
    return lo;
  }
  function valAt(arr,t){var i=idxAt(t);return arr[i];}

  function fmtUSD(v){
    if(v>=1e6) return "$"+(v/1e6).toFixed(2)+"M";
    if(v>=1e3) return "$"+Math.round(v).toLocaleString("en-US");
    return "$"+Math.round(v);
  }
  function fmtAxis(v){

    if(v>=1e3) return "$"+Math.round(v/1e3)+"k";
    return "$"+Math.round(v);
  }
  function fmtPct(m){
    var p=(m-1)*100, s=p>=-0.05?"+":"−"; p=Math.abs(p);
    var t = p>=1000 ? Math.round(p/100)*100 : p>=100 ? Math.round(p) : p>=10 ? Math.round(p) : p.toFixed(1);
    return s+(t>=1000?(t/1000)+"k":t)+"%";
  }
  function cagr(v0,v1,yrs){return (Math.pow(v1/v0,1/yrs)-1)*100;}
  function dispG(v){return state.pct?fmtPct(v/BASE):fmtUSD(v);}
  var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtDate(t){var y=Math.floor(t+1e-6);var m=Math.round((t-y)*12);if(m>11){m=0;y++;}return MONTHS[m]+" "+y;}

    b.textContent=txt;if(title)b.title=title;b.setAttribute("aria-pressed","false");cbox.appendChild(b);return b;}

  function syncFrButtons(){

    var span=state.dom[1]-state.dom[0], atEnd=Math.abs(state.dom[1]-END)<0.4;

      : '<span>% return</span><b>$ value</b>';
  }
  uBtn.addEventListener("click",function(){
    state.pct=!state.pct; state.rebase=state.pct;
    paintUnit(); render();
  });
  paintUnit();

  var curX,curY,curDomain,curSc,curI0; // closures updated per render, used by hover

  function niceLogBounds(lo,hi){
    var steps=[1,2,3,5,10];
    function floorNice(x){var d=Math.pow(10,Math.floor(Math.log(x)/Math.LN10));var r=x/d;var s=1;
      for(var i=steps.length-1;i>=0;i--){if(steps[i]<=r+1e-9){s=steps[i];break;}}return s*d;}
    function ceilNice(x){var d=Math.pow(10,Math.floor(Math.log(x)/Math.LN10));var r=x/d;var s=10;
      for(var i=0;i<steps.length;i++){if(steps[i]>=r-1e-9){s=steps[i];break;}}return s*d;}
    return [floorNice(lo/(state.pct?1.015:1.06)), ceilNice(hi*1.10)];
  }
  function logTicks(lo,hi){
    var t=[],e0=Math.floor(Math.log(lo)/Math.LN10),e1=Math.ceil(Math.log(hi)/Math.LN10);
    for(var e=e0;e<=e1;e++){[1,3].forEach(function(m){var v=m*Math.pow(10,e);
      if(v>=lo*0.999&&v<=hi*1.001)t.push(v);});}
    return t;
  }

  function render(){
    // clamp the domain
    var d1=Math.min(END,Math.max(START+MINSPAN,state.dom[1]));
    var d0=Math.max(START,Math.min(d1-MINSPAN,state.dom[0]));
    state.dom=[d0,d1];
    var i0=idxAt(d0), i1=idxAt(d1);
    curDomain=[d0,d1];

    var sc=state.rebase?[BASE/EQ[i0],BASE/BO[i0],BASE/CA[i0]]:[1,1,1];
    curSc=sc; curI0=i0;
    var SER=[[EQ,sc[0]],[BO,sc[1]],[CA,sc[2]]];
    function sv(k,i){return SER[k][0][i]*SER[k][1];}   // scaled series value

    // y-fit across visible portion of all three series
    var lo=Infinity,hi=-Infinity;
    for(var i=i0;i<=i1;i++){
      for(var k=0;k<3;k++){var q=sv(k,i); if(q<lo)lo=q; if(q>hi)hi=q;}
    }
    var yb=niceLogBounds(lo,hi), yLo=yb[0], yHi=yb[1];
    var lgLo=Math.log(yLo), lgHi=Math.log(yHi);

    var X=function(t){return pL+(t-curDomain[0])/(curDomain[1]-curDomain[0])*(pR-pL);};
    var Y=function(v){return pB-(Math.log(v)-lgLo)/(lgHi-lgLo)*(pB-pT);};
    curX=X;curY=Y;
    function disp(v){return state.pct?fmtPct(v/BASE):fmtUSD(v);}

    function pathOf(k){var d="";for(var i=i0;i<=i1;i++){d+=(i===i0?"M":"L")+X(times[i]).toFixed(2)+" "+Y(sv(k,i)).toFixed(2);}return d;}
    function eqAnchor(t){var i=idxAt(t);return sv(0,i);}

    var S=[];
    S.push('<defs><linearGradient id="eqfill" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="var(--eq-fill)" stop-opacity="0.15"/>'
      +'<stop offset="1" stop-color="var(--eq-fill)" stop-opacity="0.02"/></linearGradient></defs>');

    // y grid
    var ticks, minorFrom;
    if(state.pct){
      minorFrom=null;
      var cand=[0.5,0.7,0.8,0.9,1,1.1,1.2,1.3,1.5,1.7,2,2.5,3,4,5,7,10,15,20,30,50,70,100,200,300,500];
      ticks=cand.map(function(m){return BASE*m;}).filter(function(v){return v>=yLo*0.999&&v<=yHi*1.001;});
      if(ticks.length>9) ticks=ticks.filter(function(_,ix){return ix%2===0;});
    } else { ticks=logTicks(yLo,yHi); minorFrom=2; }
    ticks.forEach(function(g){
      var y=Y(g); if(y<pT-1||y>pB+1)return;
      var mant=g/Math.pow(10,Math.floor(Math.log(g)/Math.LN10));
      var minor = state.pct ? (Math.abs(g/BASE-Math.round(g/BASE))>0.01) : (mant>=2);
      S.push('<line class="gridline'+(minor?' minor':'')+'" x1="'+pL+'" y1="'+y.toFixed(1)+'" x2="'+pR+'" y2="'+y.toFixed(1)+'"/>');
      S.push('<text class="ax" x="'+(pL-12)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+(state.pct?fmtPct(g/BASE):fmtAxis(g))+'</text>');
    });

    // x grid
    var span=curDomain[1]-curDomain[0];
    var step= span>42?10 : span>22?5 : span>12?2 : 1;
    var startYr=Math.ceil(curDomain[0]/step)*step, lastYr=Math.floor(curDomain[1]+1e-6);
    for(var yr=startYr; yr<=lastYr; yr+=step){
      var x=X(yr); if(x<pL-1||x>pR+1)continue;
      S.push('<line class="gridline" x1="'+x.toFixed(1)+'" y1="'+pT+'" x2="'+x.toFixed(1)+'" y2="'+pB+'"/>');
      if(Math.abs(yr-curDomain[0])>step*0.55 && Math.abs(yr-curDomain[1])>step*0.55)
        S.push('<text class="ax-strong" x="'+x.toFixed(1)+'" y="'+(pB+25)+'" text-anchor="middle">'+yr+'</text>');
    }
    var lEdge = curDomain[0]<=START+0.05 ? "1957" : fmtDate(curDomain[0]);
    var rEdge = curDomain[1]>=END-0.05 ? "2026" : fmtDate(curDomain[1]);
    S.push('<text class="ax-strong" x="'+pL+'" y="'+(pB+25)+'" text-anchor="middle">'+lEdge+'</text>');
    S.push('<text class="ax-strong" x="'+pR+'" y="'+(pB+25)+'" text-anchor="middle">'+rEdge+'</text>');
    S.push('<line class="baseline" x1="'+pL+'" y1="'+pB+'" x2="'+pR+'" y2="'+pB+'"/>');

    // area + lines
    S.push('<path d="'+pathOf(0)+' L'+X(times[i1]).toFixed(2)+' '+pB+' L'+X(times[i0]).toFixed(2)+' '+pB+' Z" fill="url(#eqfill)"/>');
    S.push('<path d="'+pathOf(2)+'" fill="none" stroke="var(--cash)" stroke-width="2" stroke-linejoin="round"/>');
    S.push('<path d="'+pathOf(1)+'" fill="none" stroke="var(--bond)" stroke-width="2" stroke-linejoin="round"/>');
    S.push('<path d="'+pathOf(0)+'" fill="none" stroke="var(--eq)" stroke-width="2.4" stroke-linejoin="round"/>');

    // start + end markers
    S.push('<circle cx="'+X(curDomain[0]).toFixed(1)+'" cy="'+Y(sv(0,i0)).toFixed(1)+'" r="3.6" fill="var(--ink)"/>');
    if(state.rebase) S.push('<text class="series-end" x="'+(X(curDomain[0])+8)+'" y="'+(Y(sv(0,i0))+20)+'" fill="var(--ink-soft)">'+(state.pct?"+0%":"$10,000")+'</text>');
    [["var(--eq)",0],["var(--bond)",1],["var(--cash)",2]].forEach(function(p){
      var ey=Y(sv(p[1],i1));
      S.push('<circle cx="'+pR.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="4.5" fill="'+p[0]+'"/>');
      S.push('<text class="series-end" x="'+(pR+12)+'" y="'+(ey+4).toFixed(1)+'" fill="'+p[0]+'">'+disp(sv(p[1],i1))+'</text>');
    });

    // legend
    var lg=[["U.S. stocks &mdash; S&amp;P 500 monthly price","var(--eq)"],["U.S. bonds &mdash; IG proxy (from the 10-yr yield)","var(--bond)"],["Cash &mdash; 3-month Treasury bills","var(--cash)"]];
    var lx=pL,ly=22;
    lg.forEach(function(it){
      S.push('<line x1="'+lx+'" y1="'+ly+'" x2="'+(lx+22)+'" y2="'+ly+'" stroke="'+it[1]+'" stroke-width="3"/>');
      S.push('<text class="ax-strong" x="'+(lx+30)+'" y="'+(ly+4)+'">'+it[0]+'</text>');
      lx+=30+it[0].replace(/&[a-z]+;/g,'x').length*6.7+30;
    });

    // ---- events: keep a roughly CONSTANT count on screen at every zoom level ----
    // Show the ~TARGET most important events inside the window; a short window then
    // surfaces smaller events to fill the same quota (zoom in -> more detail).
    var TARGET = Math.min(
      (span > 55 ? DEFAULT_EVENT_COUNT - 2 : DEFAULT_EVENT_COUNT),
      Math.max(6, Math.floor((pR - pL) / 118))
    );
    var inWin = events.filter(function(e){return e[0]>=curDomain[0]-0.02 && e[0]<=curDomain[1]+0.02;})
                      .sort(function(a,b){return a[0]-b[0];});
    var vis;
    if(inWin.length<=TARGET){ vis=inWin.slice(); }
    else {
      var byTier={}; inWin.forEach(function(e){(byTier[e[5]]=byTier[e[5]]||[]).push(e);});
      vis=[];
      for(var tr=1;tr<=4 && vis.length<TARGET;tr++){
        var grp=byTier[tr]||[];
        if(vis.length+grp.length<=TARGET){ vis=vis.concat(grp); }
        else{
          var need=TARGET-vis.length, seen={};
          for(var j=0;j<need;j++){
            var ix=need>1?Math.round(j*(grp.length-1)/(need-1)):Math.floor(grp.length/2);
            while(seen[ix])ix=(ix+1)%grp.length;
            seen[ix]=1; vis.push(grp[ix]);
          }
        }
      }
      vis.sort(function(a,b){return a[0]-b[0];});
    }
    // fill conspicuous empty stretches (so no era of the visible window looks blank)
    if(inWin.length>vis.length){
      var rest=inWin.filter(function(e){return vis.indexOf(e)<0;});
      for(var pass=0;pass<3;pass++){
        var edges=[curDomain[0]].concat(vis.map(function(e){return e[0];})),g;
        edges.push(curDomain[1]);
        var gi=-1,gmax=0;
        for(g=0;g<edges.length-1;g++){var w=edges[g+1]-edges[g]; if(w>gmax){gmax=w;gi=g;}}
        if(gmax < span/5.5) break;
        var lo=edges[gi],hi=edges[gi+1],mid=(lo+hi)/2,pick=null,pri=1e9;
        rest.forEach(function(e){
          if(e[0]<=lo||e[0]>=hi)return;
          var score=e[5]*100+Math.abs(e[0]-mid);
          if(score<pri){pri=score;pick=e;}
        });
        if(!pick)break;
        vis.push(pick); rest.splice(rest.indexOf(pick),1);
        vis.sort(function(a,b){return a[0]-b[0];});
      }
    }
    var placed=[], layer=[];
    function ov(a,b){return !(a.x1<b.x0||a.x0>b.x1||a.y1<b.y0||a.y0>b.y1);}
    vis.sort(function(a,b){return a[0]-b[0];}).forEach(function(e){
      var ex=X(e[0]), ay=Y(eqAnchor(e[0]));
      var tw=Math.max(e[1].replace(/&[a-z]+;/g,'xx').length,e[2].length)*6.05;
      var left = ex+26+tw > pR-6;
      var tx = left ? ex-15-tw : ex+15;
      var b0=Math.min(ex-13,tx-5), b1=Math.max(ex+13,tx+tw+5);
      var iy=ay-42;
      for(var k=0;k<90;k++){var bb={x0:b0-3,x1:b1+3,y0:iy-13,y1:iy+15};
        if(!placed.some(function(p){return ov(bb,p);}))break; iy-=25;}
      iy=Math.max(iy,pT+12);
      placed.push({x0:b0-3,x1:b1+3,y0:iy-13,y1:iy+15});
      var col=toneCol[e[3]];
      layer.push('<line x1="'+ex.toFixed(1)+'" y1="'+(iy+12).toFixed(1)+'" x2="'+ex.toFixed(1)+'" y2="'+(ay-4).toFixed(1)+'" stroke="'+col+'" stroke-width="1" stroke-opacity="0.30"/>');
      layer.push('<circle cx="'+ex.toFixed(1)+'" cy="'+ay.toFixed(1)+'" r="3.3" fill="'+col+'" stroke="var(--panel)" stroke-width="1.4"/>');
      layer.push('<rect x="'+b0.toFixed(1)+'" y="'+(iy-14).toFixed(1)+'" width="'+(b1-b0).toFixed(1)+'" height="29" rx="4" fill="var(--halo)" fill-opacity="0.95"/>');
      layer.push('<text class="evt-label" x="'+tx.toFixed(1)+'" y="'+(iy-1).toFixed(1)+'">'+e[1]+'</text>');
      layer.push('<text class="evt-date" x="'+tx.toFixed(1)+'" y="'+(iy+12).toFixed(1)+'">'+e[2]+'</text>');
      layer.push('<circle cx="'+ex.toFixed(1)+'" cy="'+iy.toFixed(1)+'" r="11" fill="var(--halo)"/>');
      layer.push('<circle cx="'+ex.toFixed(1)+'" cy="'+iy.toFixed(1)+'" r="11" fill="'+col+'" fill-opacity="0.14" stroke="'+col+'" stroke-width="1.3"/>');
      layer.push(iconSVG(e[4],col,ex,iy));
    });
    S.push(layer.join(""));
    S.push('<g id="hover"></g>');
    S.push('<rect id="hitbox" x="'+pL+'" y="'+pT+'" width="'+(pR-pL)+'" height="'+(pB-pT)+'" fill="transparent"/>');

    svg.innerHTML=S.join("");

    // sub line + event count note
    var cnt=vis.length, full=curDomain[0]<=START+0.05 && curDomain[1]>=END-0.05;
    document.getElementById("sub").innerHTML = full
      ? "$10,000 invested when the S&amp;P 500 began in 1957 &mdash; "+cnt+" defining events marked"
      : fmtDate(curDomain[0])+" &ndash; "+fmtDate(curDomain[1])+" &mdash; "+cnt+" events (about the same count at every zoom; scroll-wheel to zoom, smaller events appear as you look closer)";
  }

  /* ============ HOVER / CROSSHAIR ============================ */
  var pt=svg.createSVGPoint(), lastC={cx:0,cy:0};
  function localX(evt){
    var cx=(evt.touches?evt.touches[0].clientX:evt.clientX);
    var cy=(evt.touches?evt.touches[0].clientY:evt.clientY);
    lastC.cx=cx; lastC.cy=cy;
    pt.x=cx; pt.y=cy;
    var m=svg.getScreenCTM(); if(!m)return null;
    return pt.matrixTransform(m.inverse()).x;
  }
  function moveHover(evt){
    if(drag.on) return;
    var x=localX(evt); if(x==null)return;
    x=Math.max(pL,Math.min(pR,x));
    var t=curDomain[0]+(x-pL)/(pR-pL)*(curDomain[1]-curDomain[0]);
    var i=idxAt(t); if(i<curI0)i=curI0; var tx=curX(times[i]);
    var g=svg.querySelector("#hover"); if(!g)return;

    var h=['<line class="cross" x1="'+tx.toFixed(1)+'" y1="'+pT+'" x2="'+tx.toFixed(1)+'" y2="'+pB+'"/>'];
    var vs=[
      {v:EQ[i]*curSc[0],col:"var(--eq)"},
      {v:BO[i]*curSc[1],col:"var(--bond)"},
      {v:CA[i]*curSc[2],col:"var(--cash)"}
    ];
    vs.forEach(function(o){ o.y0=curY(o.v); o.y=o.y0; o.txt=dispG(o.v); });
    // dots sit exactly on each asset line
    vs.forEach(function(o){ h.push('<circle cx="'+tx.toFixed(1)+'" cy="'+o.y0.toFixed(1)+'" r="4.5" fill="'+o.col+'" stroke="var(--panel)" stroke-width="1.5"/>'); });
    // value labels ride on the lines (nudge apart only if they'd overlap)
    vs.slice().sort(function(a,b){return a.y0-b.y0;}).forEach(function(o,k,arr){ if(k && o.y-arr[k-1].y<16) o.y=arr[k-1].y+16; });
    var left = tx > pR-150;
    vs.forEach(function(o){
      var w=o.txt.length*7.3+14, y=Math.max(pT+9,Math.min(pB-9,o.y));
      var px=left ? tx-9-w : tx+9;
      h.push('<line x1="'+tx.toFixed(1)+'" y1="'+o.y0.toFixed(1)+'" x2="'+(left?px+w:px).toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+o.col+'" stroke-width="1" stroke-opacity="0.45"/>');
      h.push('<rect x="'+px.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" width="'+w.toFixed(1)+'" height="18" rx="3" fill="var(--panel)" stroke="'+o.col+'" stroke-width="1.2"/>');
      h.push('<text x="'+(px+w/2).toFixed(1)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="middle" fill="'+o.col+'" font-size="11.5" font-weight="700" font-family="Arial,Helvetica,sans-serif">'+o.txt+'</text>');
    });
    // date pill pinned on the x-axis
    var dlab=fmtDate(times[i]), dw=dlab.length*7.2+18;
    var dpx=Math.max(pL+dw/2, Math.min(pR-dw/2, tx));
    h.push('<rect x="'+(dpx-dw/2).toFixed(1)+'" y="'+(pB+6)+'" width="'+dw.toFixed(1)+'" height="20" rx="4" fill="var(--ink)"/>');
    h.push('<text x="'+dpx.toFixed(1)+'" y="'+(pB+20)+'" text-anchor="middle" fill="var(--panel)" font-size="12" font-weight="600" font-family="Arial,Helvetica,sans-serif">'+dlab+'</text>');
    g.innerHTML=h.join("");
  }
  function endHover(){var g=svg.querySelector("#hover"); if(g)g.innerHTML="";}
  svg.addEventListener("mousemove",moveHover);
  svg.addEventListener("mouseleave",endHover);

  var tch={x:0,y:0,mode:0,dom0:null};   // mode 0 undecided, 1 hover, 2 pan
  svg.addEventListener("touchstart",function(e){
    tch.x=e.touches[0].clientX; tch.y=e.touches[0].clientY; tch.mode=0; tch.dom0=state.dom.slice();
  },{passive:true});
  svg.addEventListener("touchmove",function(e){
    var dx=e.touches[0].clientX-tch.x, dy=e.touches[0].clientY-tch.y;
    if(tch.mode===0 && Math.abs(dx)+Math.abs(dy)>8) tch.mode = Math.abs(dx)>Math.abs(dy)*1.3 ? 2 : 1;
    if(tch.mode===2){
      var rw=svg.getBoundingClientRect().width||W, sp=tch.dom0[1]-tch.dom0[0];
      var dyr=-(dx/rw)*(W/(pR-pL))*sp;
      var n0=tch.dom0[0]+dyr,n1=tch.dom0[1]+dyr;
      if(n0<START){n1+=START-n0;n0=START;} if(n1>END){n0-=n1-END;n1=END;}
      state.dom=[n0,n1]; endHover(); scheduleRender();
    } else { moveHover(e); }
  },{passive:true});
  svg.addEventListener("touchend",function(){ if(tch.mode!==2) endHover(); });

  /* ---- drag to pan left / right ---- */
  var drag={on:false,x0:0,dom0:null,moved:false};
  function panFrom(clientX){
    var sp=drag.dom0[1]-drag.dom0[0];
    var dx=clientX-drag.x0;
    var r=svg.getBoundingClientRect();
    var dyr=-(dx/r.width)*(W/(pR-pL))*sp;      // pixels -> years, account for plot inset
    var n0=drag.dom0[0]+dyr, n1=drag.dom0[1]+dyr;
    if(n0<START){n1+=START-n0;n0=START;}
    if(n1>END){n0-=n1-END;n1=END;}
    state.dom=[n0,n1];
  }
  svg.addEventListener("mousedown",function(evt){
    if(evt.button!==0)return;
    evt.preventDefault();
    drag.on=true; drag.moved=false; drag.x0=evt.clientX; drag.dom0=state.dom.slice();
    endHover();
  });
  svg.addEventListener("dragstart",function(e){e.preventDefault();});
  window.addEventListener("mousemove",function(evt){
    if(!drag.on)return;
    if(Math.abs(evt.clientX-drag.x0)>3){drag.moved=true; svg.classList.add("dragging");}
    if(drag.moved){ panFrom(evt.clientX);
      if(!wheelRAF) wheelRAF=requestAnimationFrame(function(){wheelRAF=0; syncFrButtons(); render();}); }
  });
  window.addEventListener("mouseup",function(){
    if(!drag.on)return;
    drag.on=false; svg.classList.remove("dragging");
  });

  /* ---- wheel: vertical = zoom about cursor · horizontal (or Shift) = pan ---- */
  var wheelRAF=0;
  function scheduleRender(){ if(!wheelRAF) wheelRAF=requestAnimationFrame(function(){wheelRAF=0; syncFrButtons(); render();}); }
  function panByPx(px){
    var rw=svg.getBoundingClientRect().width||W, sp=state.dom[1]-state.dom[0];
    var dyr=(px/rw)*(W/(pR-pL))*sp;
    var n0=state.dom[0]+dyr, n1=state.dom[1]+dyr;
    if(n0<START){n1+=START-n0;n0=START;}
    if(n1>END){n0-=n1-END;n1=END;}
    state.dom=[n0,n1];
  }
  svg.addEventListener("wheel",function(evt){
    evt.preventDefault();
    var dx=evt.deltaX||0, dy=evt.deltaY||0;
    if(evt.shiftKey && !dx){ dx=dy; dy=0; }              // Shift+wheel pans
    if(Math.abs(dx) > Math.abs(dy)){                     // trackpad horizontal swipe -> pan
      if(Math.abs(dx)<0.5) return;
      panByPx(dx); scheduleRender(); return;
    }
    if(Math.abs(dy)<1) return;
    var x=localX(evt); if(x==null)return;
    x=Math.max(pL,Math.min(pR,x));
    var d0=state.dom[0], d1=state.dom[1], sp=d1-d0;
    var tc=d0+(x-pL)/(pR-pL)*sp;
    var nsp=Math.max(MINSPAN, Math.min(END-START, sp*Math.pow(1.0016,dy)));
    var n0=tc-(tc-d0)*(nsp/sp), n1=n0+nsp;
    if(n0<START){ n0=START; n1=START+nsp; }
    if(n1>END){ n1=END; n0=END-nsp; }
    state.dom=[n0,n1];
    scheduleRender();
  },{passive:false});

  var rt; window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(render,150);});
  syncFrButtons(); render();

  /* ============ FOOTNOTE ==================================== */
  document.getElementById("foot").innerHTML=
    '<strong>How to read this.</strong> Illustrative growth of a single $10,000 investment made when the S&amp;P 500 launched (year-end 1957) and held through Sep 1, 2026, on a <strong>ratio (log) scale</strong>. '
    +'Zoom with the time-frame buttons or the mouse wheel (about the cursor); pan by dragging or with a two-finger / horizontal swipe. The y-axis rescales to the visible window, and a roughly <strong>constant number of events stays on screen at every zoom level</strong> &mdash; drawn from a curated importance-ranked index of ~150 market events (at least one per year) (default '+DEFAULT_EVENT_COUNT+' on screen), most significant first, with finer detail filling in as you zoom into a period. Hover or tap the chart to read each asset&rsquo;s value on its own line. '
    +'Stocks are the S&amp;P 500 <strong>monthly price</strong> (40.33 in Dec 1957 &rarr; 7,711 in Aug 2026), price return only. Cash is the 3-month U.S. Treasury-bill rate, compounded monthly. Bonds are an investment-grade proxy <strong>modelled from the 10-year Treasury yield</strong> (~7-year duration plus a small credit / roll carry) &mdash; it follows real rate moves, including the ~11% draw-down in 2022, but is not an actual index. Because stocks exclude dividends while bonds and cash include income, the equity line understates stocks&rsquo; true lead. Past performance is not indicative of future results. '
    +'<br>Sources: S&amp;P Dow Jones Indices / R. Shiller (S&amp;P 500 monthly); Federal Reserve &mdash; FRED series TB3MS and GS10. Monthly data through Aug 2026.';
})();
</script>
