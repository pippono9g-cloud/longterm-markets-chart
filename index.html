<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stocks, Bonds &amp; Cash Since 1957</title>
<style>
  /* House theme — matches the Thailand Fund Risk-Return / Fund-flow / Performance dashboards */
  :root{
    --scb:#4F2D7F; --scb-l:#EFE9F7; --scb-d:#3a2160;
    --ground:#ffffff; --panel:#ffffff;
    --ink:#1a1a1a; --ink-soft:#4d4d4d; --ink-mute:#666666;
    --grid:#e5e5e5; --hair:#cccccc; --soft:#f2f2f2;
    --eq:#4F2D7F; --eq-fill:#4F2D7F; --bond:#B45309; --cash:#007BB0;
    --shock:#b91c1c; --policy:#475569; --milestone:#047857;
    --halo:#ffffff;
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);margin:0;
    font-family:Arial,Helvetica,"Segoe UI","Noto Sans Thai",sans-serif;
    font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1500px;margin:0 auto;padding:24px 24px 52px}
  .title-bar{padding:2px 0 14px;margin-bottom:18px;border-bottom:1px solid var(--hair)}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);margin:0 0 4px}
  h1{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:0}
  .sub{font-size:13px;font-weight:700;color:var(--scb);margin:4px 0 0}
  .card{border:1px solid var(--hair);border-radius:12px;padding:16px 18px 18px;
    box-shadow:0 1px 3px rgba(79,45,127,.06)}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 4px}
  .controls .lbl{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-mute);margin-right:2px}
  .tf-btn{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-soft);background:#fff;
    border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;transition:.12s}
  .tf-btn:hover{background:var(--soft);color:var(--ink)}
  .tf-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .tf-btn:focus-visible{outline:2px solid var(--scb);outline-offset:2px}
  .tf-btn:disabled{opacity:.38;cursor:not-allowed}
  .tf-btn.switch{padding:3px 4px;display:inline-flex;gap:3px;align-items:center;background:var(--soft);border-color:var(--ink)}
  .tf-btn.switch b,.tf-btn.switch span{padding:3px 11px;border-radius:999px;font-size:12.5px;line-height:1.35;font-weight:700}
  .tf-btn.switch b{background:var(--ink);color:#fff}
  .tf-btn.switch span{color:var(--ink-mute);font-weight:600}
  .tf-btn.grp{font-size:11px;font-weight:700;padding:4px 10px;border-width:1.5px;border-color:var(--hair);color:var(--ink-mute)}
  .tf-btn.grp[aria-pressed="true"]{background:var(--soft);border-color:var(--ink);color:var(--ink)}
  .tf-btn.grp[aria-pressed="false"]{opacity:1;background:#fff;color:#4d4d4d}
  .tf-btn.grp-all{font-size:11px;padding:4px 10px;border-color:var(--scb);color:var(--scb)}
  .tf-btn.grp-all:hover{background:var(--scb-l)}
  .yr-in{font:inherit;font-size:12.5px;font-weight:700;width:56px;text-align:center;color:var(--ink);
    border:1.5px solid var(--ink);border-radius:8px;padding:4px 6px;background:#fff}
  .yr-in::placeholder{color:var(--ink-mute);font-weight:400}
  .yr-in:focus-visible{outline:2px solid var(--scb);outline-offset:1px}
  .controls .dash{color:var(--ink-mute);font-weight:700;margin:0 -2px}
  figure{margin:12px 0 0;position:relative;touch-action:none}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:none;cursor:crosshair;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  svg.dragging{cursor:grabbing}
  .chart-scroll{overflow:hidden;touch-action:none}
  .foot{margin:14px 0 0;font-size:11.5px;line-height:1.55;color:var(--ink-mute);border-top:1px solid var(--hair);padding-top:11px}
  .foot strong{color:var(--ink-soft);font-weight:700}
  text{font-family:Arial,Helvetica,"Noto Sans Thai",sans-serif}
  .ax{fill:var(--ink-mute);font-size:12px;font-weight:400}
  .ax-strong{fill:var(--ink-soft);font-size:12px;font-weight:700}
  .gridline{stroke:var(--grid);stroke-width:1}
  .gridline.minor{stroke-dasharray:2 3;opacity:.6}
  .baseline{stroke:var(--ink-soft);stroke-width:1.4}
  .evt-label{fill:var(--ink);font-size:12px;font-weight:700}
  .evt-date{fill:var(--ink-mute);font-size:11px;font-weight:400}
  .series-end{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .cross{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3;opacity:.75}

  .help,.view-summary{color:var(--ink-soft);font-size:13px}.view-summary{font-weight:700}
  .tf-btn{min-height:36px}.tf-btn.grp{min-height:36px}.tf-btn.grp[aria-pressed="true"]{background:var(--scb-l);border-color:var(--scb);color:var(--scb)}
  .event-explorer{margin-top:20px;border-top:1px solid var(--hair);padding-top:18px}
  #event-tools{align-items:center}#event-tools input,#event-tools select{font:inherit;padding:10px;border:1px solid var(--hair);border-radius:8px;min-height:44px}
  #event-tools input{flex:1;min-width:200px}.event-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .event-list{max-height:340px;overflow:auto}.event-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--grid);background:#fff;padding:12px;font:inherit;cursor:pointer;min-height:44px}
  .event-item:hover,.event-item[aria-pressed="true"]{background:var(--scb-l)}.event-item small{display:block;color:var(--ink-mute);margin-top:4px}
  [data-event]:focus{outline:none}
  [data-event] .event-ring{transition:stroke .12s,stroke-width .12s}
  [data-event][aria-pressed="true"] .event-ring{stroke:var(--scb-d);stroke-width:3.5;fill:var(--scb-l);fill-opacity:1}
  [data-event]:focus-visible .event-ring{stroke:var(--scb-d);stroke-width:3.5;stroke-dasharray:3 2}
  [data-event][aria-pressed="true"]:focus-visible .event-ring{stroke-dasharray:none}
  [data-event][aria-pressed="true"] .evt-label{fill:var(--scb-d)}
  .detail-meta,.detail-tags{font-size:12px;color:var(--ink-mute)}.detail-tags{color:var(--scb)}
  .event-detail h3{font-size:13px;margin:20px 0 6px;color:var(--scb)}.event-detail section{line-height:1.8}.event-detail section p{margin:0 0 12px}
  .detail-sources p{margin:6px 0;font-size:12px}.detail-sources small{display:block;color:var(--ink-mute)}.detail-sources a{color:var(--scb)}
  .detail-method{font-size:11px;color:var(--ink-mute);margin-top:18px}.detail-method summary{cursor:pointer;padding:8px 0}
  .related-event{display:block;width:100%;background:#fff;border:1px solid var(--hair);padding:10px;text-align:left;border-radius:6px;font:inherit;font-size:12px;cursor:pointer}
  .event-layout{align-items:start}
  .event-detail{background:var(--soft);border-radius:10px;padding:18px}.event-detail h2{font-size:18px;margin-top:0}.event-detail button{margin-top:8px}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--scb);outline-offset:2px}
  @media(max-width:700px){.wrap{padding:14px}h1{font-size:25px}.card{padding:12px}.event-layout{grid-template-columns:1fr}.event-list{max-height:260px}.tf-btn{min-height:44px}.tf-btn.grp{min-height:44px}.ax,.ax-strong,.series-end{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title-bar">
    <h1>Stocks, bonds &amp; cash over the long run</h1>
  </div>

  <div class="card">
    <div class="controls" id="controls">
      <span class="lbl">Time frame</span>
    </div>

    <p id="view-summary" class="view-summary"></p>
    <p class="help">Choose event categories below, or search events in the visible period. Drag to pan · Scroll or pinch to zoom. Returns restart at the visible period’s beginning.</p>
    <figure>
      <div class="chart-scroll">
        <svg id="chart" viewBox="0 0 1760 780" role="img"
             aria-label="Interactive logarithmic chart of $10,000 invested in U.S. stocks, bonds and cash since 1957, with adjustable time frame and event annotations that reveal more detail when zoomed in."></svg>
      </div>
    </figure>

    <section class="event-explorer" aria-label="Event explorer">
      <div id="event-tools" class="controls"></div>
      <p id="event-status" role="status" aria-live="polite"></p>
      <div class="event-layout"><div id="event-list" class="event-list" aria-label="Matching events"></div>
      <article id="event-detail" class="event-detail" aria-label="Event details"><h2>Explore market history</h2><p>Select an event to see its context and focus the chart.</p></article></div>
    </section>
    <p class="foot" id="foot"></p>
  </div>
</div>

  /* ---- wheel: vertical = zoom about cursor · horizontal (or Shift) = pan ---- */
  var wheelRAF=0, fullTimer=0, pendFast=false;
  function scheduleRender(fast){
    if(fast) pendFast=true;
    if(!wheelRAF) wheelRAF=requestAnimationFrame(function(){
      wheelRAF=0; var f=pendFast; pendFast=false; syncFrButtons(); render(f);
    });
    if(fast){                                   // once motion stops, do one full (with events)
      clearTimeout(fullTimer);
      fullTimer=setTimeout(function(){ syncFrButtons(); render(false); }, 170);
    }
  }
  function panByPx(px){
    var rw=svg.getBoundingClientRect().width||W, sp=state.dom[1]-state.dom[0];
    var dyr=(px/rw)*(W/(pR-pL))*sp;
    var n0=state.dom[0]+dyr, n1=state.dom[1]+dyr;
    if(n0<START){n1+=START-n0;n0=START;}
    if(n1>END){n0-=n1-END;n1=END;}
    state.dom=[n0,n1];
  }
  hit.addEventListener("wheel",function(evt){
    evt.preventDefault();
    var dx=evt.deltaX||0, dy=evt.deltaY||0;
    if(evt.shiftKey && !dx){ dx=dy; dy=0; }              // Shift+wheel pans
    if(Math.abs(dx) > Math.abs(dy)){                     // trackpad horizontal swipe -> pan
      if(Math.abs(dx)<0.5) return;
      panByPx(dx); scheduleRender(true); return;
    }
    if(Math.abs(dy)<1) return;
    var x=localX(evt); if(x==null)return;
    x=Math.max(pL,Math.min(pR,x));
    var d0=state.dom[0], d1=state.dom[1], sp=d1-d0;
    var tc=d0+(x-pL)/(pR-pL)*sp;
    var nsp=Math.max(MINSPAN, Math.min(END-START, sp*Math.pow(1.0016,dy)));
    var n0=tc-(tc-d0)*(nsp/sp), n1=n0+nsp;
    if(n0<START){ n0=START; n1=START+nsp; }
    if(n1>END){ n1=END; n0=END-nsp; }
    state.dom=[n0,n1];
    scheduleRender(true);
  },{passive:false});

  var rt; window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(render,150);});
  syncFrButtons(); render(); updateExplorer();

  /* ============ FOOTNOTE ==================================== */
  document.getElementById("foot").innerHTML=
    '<strong>How to read this.</strong> Illustrative growth of a single $10,000 invested at the left edge of the window you are viewing (so the three lines always start together), drawn on a <strong>ratio (log) scale</strong>. Toggle the y-axis between that dollar value and cumulative % return. '
    +'Use the time-frame buttons or + / − to zoom. Mouse wheel or pinch zooms; drag to pan. Select categories (matches any selected category), or search event names and categories within the visible period. The list follows zoom and pan; chart labels are limited to avoid crowding and are hidden on narrow screens. Select a list item for details and a focus-period button. Category tags describe context, not a single proven cause. Event dates are approximate and importance is editorial. '
    +'Stocks are the S&amp;P 500 <strong>monthly price</strong> (40.33 in Dec 1957 &rarr; 7,711 in Aug 2026), price return only. Cash is the 3-month U.S. Treasury-bill rate, compounded monthly. Bonds are the Bloomberg U.S. Aggregate: <strong>actual month-end total return of the iShares Core U.S. Aggregate Bond ETF (AGG)</strong> from its 2003 launch, the Vanguard Total Bond Market Index Fund (VBMFX, same benchmark) for 1987&ndash;2003, and a 10-year-yield model calibrated to published annual returns before that. Month-end values, so single-day extremes are muted, but every down month &mdash; 1994, 2013 and the &minus;13% of 2022 &mdash; is real. Because stocks exclude dividends while bonds and cash include income, the equity line understates stocks&rsquo; true lead. Past performance is not indicative of future results. '
    +'<br>Sources: S&amp;P Dow Jones Indices / R. Shiller (S&amp;P 500 monthly); FRED (TB3MS, GS10); iShares & Vanguard / Yahoo Finance (AGG, VBMFX total return); annual bond returns from Ibbotson / Morningstar. Monthly data through Aug 2026.';
})();
