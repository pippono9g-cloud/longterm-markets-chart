  .stat.eq{--c:var(--eq)} .stat.bond{--c:var(--bond)} .stat.cash{--c:var(--cash)}

  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 6px}

  .tf-btn:hover{border-color:var(--ink-mute)}
  .tf-btn[aria-pressed="true"]{background:var(--eq);border-color:var(--eq);color:#fff}
  .tf-btn:focus-visible{outline:2px solid var(--eq);outline-offset:2px}
  .tf-btn:disabled{opacity:.4;cursor:not-allowed}
  figure{margin:12px 0 0;position:relative}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
  .chart-scroll{overflow-x:hidden}
  .tip{position:absolute;pointer-events:none;z-index:5;background:var(--panel);border:1px solid var(--hair);
    border-radius:6px;padding:9px 11px;font-size:12.5px;box-shadow:0 8px 26px -10px rgba(11,28,46,.4);
    min-width:172px;opacity:0;transition:opacity .1s}
  .tip.on{opacity:1}
  .tip .td{font-weight:700;font-size:12px;letter-spacing:.02em;margin-bottom:5px;color:var(--ink)}
  .tip .tr{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:2px 0}
  .tip .tr span{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-weight:500}
  .tip .tr b{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
  .tip .dot{width:9px;height:9px;border-radius:2px;flex:none}
  .foot{margin:16px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink-mute);border-top:1px solid var(--hair);padding-top:11px}
  .foot strong{color:var(--ink-soft);font-weight:600}
  text{font-family:"Libre Franklin",sans-serif}
  .ax{fill:var(--ink-mute);font-size:13px;font-weight:500}
  .ax-strong{fill:var(--ink-soft);font-size:13px;font-weight:600}
  .gridline{stroke:var(--grid);stroke-width:1}
  .gridline.minor{stroke-dasharray:2 3;opacity:.6}
  .baseline{stroke:var(--ink-soft);stroke-width:1.5}
  .evt-label{fill:var(--ink);font-size:12px;font-weight:600}
  .evt-date{fill:var(--ink-mute);font-size:11px;font-weight:500}
  .series-end{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .cross{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
</style>

  /* ============ SERIES (built once) ============================ */
  function rnd(s){var x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);}
  function interpA(a,t){
    if(t<=a[0][0])return a[0][1];
    for(var i=1;i<a.length;i++){if(t<=a[i][0]){var f=(t-a[i-1][0])/(a[i][0]-a[i-1][0]);
      return Math.exp(Math.log(a[i-1][1])+(Math.log(a[i][1])-Math.log(a[i-1][1]))*f);}}
    return a[a.length-1][1];
  }
  function retFrac(tbl,t0,t1){var v=1,y=Math.floor(t0);
    while(y<=Math.floor(t1-1e-9)){var f=Math.min(t1,y+1)-Math.max(t0,y);v*=Math.pow(1+(tbl[y]||0)/100,f);y++;}return v;}

  function idxAt(t){ // nearest sample index for a decimal year
    var lo=0,hi=times.length-1;
    while(lo<hi){var m=(lo+hi)>>1; if(times[m]<t)lo=m+1; else hi=m;}
    if(lo>0 && Math.abs(times[lo-1]-t)<Math.abs(times[lo]-t))lo--;
    return lo;
  }
  function valAt(arr,t){var i=idxAt(t);return arr[i];}

  function fmtUSD(v){
    if(v>=1e6) return "$"+(v/1e6).toFixed(2)+"M";
    if(v>=1e3) return "$"+Math.round(v).toLocaleString("en-US");
    return "$"+Math.round(v);
  }
  function fmtAxis(v){
    if(v>=1e6) return "$"+(v/1e6).toFixed(v>=1e7?0:1).replace(/\.0$/,'')+"M";
    if(v>=1e3) return "$"+Math.round(v/1e3)+"k";
    return "$"+Math.round(v);
  }
  function fmtPct(m){
    var p=(m-1)*100, s=p>=-0.05?"+":"−"; p=Math.abs(p);
    var t = p>=1000 ? Math.round(p/100)*100 : p>=100 ? Math.round(p) : p>=10 ? Math.round(p) : p.toFixed(1);
    return s+(t>=1000?(t/1000)+"k":t)+"%";
  }
  function cagr(v0,v1,yrs){return (Math.pow(v1/v0,1/yrs)-1)*100;}
  function dispG(v){return state.pct?fmtPct(v/BASE):fmtUSD(v);}
  var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtDate(t){var y=Math.floor(t+1e-6);var m=Math.round((t-y)*12);if(m>11){m=0;y++;}return MONTHS[m]+" "+y;}

  /* ============ STAT TILES ==================================== */
  var eqEnd=EQ[EQ.length-1],boEnd=BO[BO.length-1],caEnd=CA[CA.length-1];
  document.getElementById("stats").innerHTML=[
    {c:"eq",k:"U.S. stocks (S&P 500)",v:fmtUSD(eqEnd),n:cagr(BASE,eqEnd,END-START).toFixed(1)+"% annualized &middot; price return"},
    {c:"bond",k:"U.S. bonds (IG / Agg)",v:fmtUSD(boEnd),n:cagr(BASE,boEnd,END-START).toFixed(1)+"% annualized &middot; total return"},
    {c:"cash",k:"Cash (T-bills / savings)",v:fmtUSD(caEnd),n:cagr(BASE,caEnd,END-START).toFixed(1)+"% annualized &middot; total return"}
  ].map(function(s){return '<div class="stat '+s.c+'"><div class="k">'+s.k+'</div><div class="v">'+s.v+'</div><div class="n">'+s.n+'</div></div>';}).join("");

  /* ============ CHART ======================================== */
  var svg=document.getElementById("chart"), tip=document.getElementById("tip");
  var W=1760,H=780, mL=82,mR=196,mT=44,mB=48;
  var pL=mL,pR=W-mR,pT=mT,pB=H-mB;
  var toneCol={shock:"var(--shock)",policy:"var(--policy)",milestone:"var(--milestone)"};

  var FRAMES=[
    {k:"Max",yrs:END-START},{k:"40Y",yrs:40},{k:"25Y",yrs:25},
    {k:"15Y",yrs:15},{k:"10Y",yrs:10},{k:"5Y",yrs:5}
  ];
  var state={fi:0,rebase:false,pct:false};

  var cbox=document.getElementById("controls");
  function mkBtn(txt,title){var b=document.createElement("button");b.className="tf-btn";b.type="button";
    b.textContent=txt;if(title)b.title=title;b.setAttribute("aria-pressed","false");cbox.appendChild(b);return b;}

  // time-frame buttons
  var frButtons=FRAMES.map(function(f,i){
    var b=mkBtn(f.k);
    if(i===0)b.setAttribute("aria-pressed","true");
    b.addEventListener("click",function(){state.fi=i;
      frButtons.forEach(function(x,j){x.setAttribute("aria-pressed",j===i?"true":"false");});
      render();});
    return b;
  });

  var s1=document.createElement("span");s1.className="lbl";s1.style.marginLeft="12px";s1.textContent="Y-axis";cbox.appendChild(s1);
  var bDollar=mkBtn("$ value","Dollar value of the investment"),
      bPct=mkBtn("% return","Cumulative % return since the left edge of the visible window");
  bDollar.setAttribute("aria-pressed","true");
  function setUnit(pct){
    state.pct=pct; if(pct)state.rebase=true;
    bDollar.setAttribute("aria-pressed",pct?"false":"true");
    bPct.setAttribute("aria-pressed",pct?"true":"false");
    bWin.disabled=pct; b1957.disabled=pct;
    if(pct){ setFrom(true); } render();
  }
  bDollar.addEventListener("click",function(){setUnit(false);});
  bPct.addEventListener("click",function(){setUnit(true);});

  var s2=document.createElement("span");s2.className="lbl";s2.style.marginLeft="12px";s2.textContent="From";cbox.appendChild(s2);
  var b1957=mkBtn("1957","Grow from the original $10,000 in 1957"),
      bWin=mkBtn("window start","Restart every line at $10,000 at the left edge, to compare growth within the chosen window");
  b1957.setAttribute("aria-pressed","true");
  function setFrom(reb){
    state.rebase=reb;
    b1957.setAttribute("aria-pressed",reb?"false":"true");
    bWin.setAttribute("aria-pressed",reb?"true":"false");
  }
  b1957.addEventListener("click",function(){ if(state.pct)return; setFrom(false); render();});
  bWin.addEventListener("click",function(){ if(state.pct)return; setFrom(true); render();});

  var curX,curY,curDomain,curSc,curI0; // closures updated per render, used by hover

  function niceLogBounds(lo,hi){
    var steps=[1,2,3,5,10];
    function floorNice(x){var d=Math.pow(10,Math.floor(Math.log(x)/Math.LN10));var r=x/d;var s=1;
      for(var i=steps.length-1;i>=0;i--){if(steps[i]<=r+1e-9){s=steps[i];break;}}return s*d;}
    function ceilNice(x){var d=Math.pow(10,Math.floor(Math.log(x)/Math.LN10));var r=x/d;var s=10;
      for(var i=0;i<steps.length;i++){if(steps[i]>=r-1e-9){s=steps[i];break;}}return s*d;}
    return [floorNice(lo/1.06), ceilNice(hi*1.10)];
  }
  function logTicks(lo,hi){
    var t=[],e0=Math.floor(Math.log(lo)/Math.LN10),e1=Math.ceil(Math.log(hi)/Math.LN10);
    for(var e=e0;e<=e1;e++){[1,3].forEach(function(m){var v=m*Math.pow(10,e);
      if(v>=lo*0.999&&v<=hi*1.001)t.push(v);});}
    return t;
  }

  function render(){
    var f=FRAMES[state.fi];
    var s0=Math.max(START, END-f.yrs);
    var i0=idxAt(s0), i1=times.length-1;
    curDomain=[times[i0],END];

    var sc=state.rebase?[BASE/EQ[i0],BASE/BO[i0],BASE/CA[i0]]:[1,1,1];
    curSc=sc; curI0=i0;
    var SER=[[EQ,sc[0]],[BO,sc[1]],[CA,sc[2]]];
    function sv(k,i){return SER[k][0][i]*SER[k][1];}   // scaled series value

    // y-fit across visible portion of all three series
    var lo=Infinity,hi=-Infinity;
    for(var i=i0;i<=i1;i++){
      for(var k=0;k<3;k++){var q=sv(k,i); if(q<lo)lo=q; if(q>hi)hi=q;}
    }
    var yb=niceLogBounds(lo,hi), yLo=yb[0], yHi=yb[1];
    var lgLo=Math.log(yLo), lgHi=Math.log(yHi);

    var X=function(t){return pL+(t-curDomain[0])/(curDomain[1]-curDomain[0])*(pR-pL);};
    var Y=function(v){return pB-(Math.log(v)-lgLo)/(lgHi-lgLo)*(pB-pT);};
    curX=X;curY=Y;
    function disp(v){return state.pct?fmtPct(v/BASE):fmtUSD(v);}

    function pathOf(k){var d="";for(var i=i0;i<=i1;i++){d+=(i===i0?"M":"L")+X(times[i]).toFixed(2)+" "+Y(sv(k,i)).toFixed(2);}return d;}
    function eqAnchor(t){var i=idxAt(t);return sv(0,i);}

    var S=[];
    S.push('<defs><linearGradient id="eqfill" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="var(--eq-fill)" stop-opacity="0.15"/>'
      +'<stop offset="1" stop-color="var(--eq-fill)" stop-opacity="0.02"/></linearGradient></defs>');

    // y grid
    var ticks, minorFrom;
    if(state.pct){
      minorFrom=null;
      var cand=[0.5,0.7,0.8,0.9,1,1.1,1.2,1.3,1.5,1.7,2,2.5,3,4,5,7,10,15,20,30,50,70,100,200,300,500];
      ticks=cand.map(function(m){return BASE*m;}).filter(function(v){return v>=yLo*0.999&&v<=yHi*1.001;});
      if(ticks.length>9) ticks=ticks.filter(function(_,ix){return ix%2===0;});
    } else { ticks=logTicks(yLo,yHi); minorFrom=2; }
    ticks.forEach(function(g){
      var y=Y(g); if(y<pT-1||y>pB+1)return;
      var mant=g/Math.pow(10,Math.floor(Math.log(g)/Math.LN10));
      var minor = state.pct ? (Math.abs(g/BASE-Math.round(g/BASE))>0.01) : (mant>=2);
      S.push('<line class="gridline'+(minor?' minor':'')+'" x1="'+pL+'" y1="'+y.toFixed(1)+'" x2="'+pR+'" y2="'+y.toFixed(1)+'"/>');
      S.push('<text class="ax" x="'+(pL-12)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+(state.pct?fmtPct(g/BASE):fmtAxis(g))+'</text>');
    });

    // x grid
    var span=curDomain[1]-curDomain[0];
    var step= span>42?10 : span>22?5 : span>12?2 : 1;
    var startYr=Math.ceil(curDomain[0]/step)*step;
    for(var yr=startYr; yr<=2026; yr+=step){
      var x=X(yr); if(x<pL-1||x>pR+1)continue;
      S.push('<line class="gridline" x1="'+x.toFixed(1)+'" y1="'+pT+'" x2="'+x.toFixed(1)+'" y2="'+pB+'"/>');
      if(Math.abs(yr-curDomain[0])>step*0.55 && Math.abs(yr-2026)>step*0.55)
        S.push('<text class="ax-strong" x="'+x.toFixed(1)+'" y="'+(pB+25)+'" text-anchor="middle">'+yr+'</text>');
    }
    S.push('<text class="ax-strong" x="'+X(curDomain[0]).toFixed(1)+'" y="'+(pB+25)+'" text-anchor="middle">'+(Math.round(curDomain[0]*10)/10===Math.round(START*10)/10?"1957":Math.ceil(curDomain[0])) +'</text>');
    S.push('<text class="ax-strong" x="'+X(END).toFixed(1)+'" y="'+(pB+25)+'" text-anchor="middle">2026</text>');
    S.push('<line class="baseline" x1="'+pL+'" y1="'+pB+'" x2="'+pR+'" y2="'+pB+'"/>');

    // area + lines
    S.push('<path d="'+pathOf(0)+' L'+X(END).toFixed(2)+' '+pB+' L'+X(curDomain[0]).toFixed(2)+' '+pB+' Z" fill="url(#eqfill)"/>');
    S.push('<path d="'+pathOf(2)+'" fill="none" stroke="var(--cash)" stroke-width="2" stroke-linejoin="round"/>');
    S.push('<path d="'+pathOf(1)+'" fill="none" stroke="var(--bond)" stroke-width="2" stroke-linejoin="round"/>');
    S.push('<path d="'+pathOf(0)+'" fill="none" stroke="var(--eq)" stroke-width="2.4" stroke-linejoin="round"/>');

    // start + end markers
    S.push('<circle cx="'+X(curDomain[0]).toFixed(1)+'" cy="'+Y(sv(0,i0)).toFixed(1)+'" r="3.6" fill="var(--ink)"/>');
    if(state.rebase) S.push('<text class="series-end" x="'+(X(curDomain[0])+8)+'" y="'+(Y(sv(0,i0))+20)+'" fill="var(--ink-soft)">'+(state.pct?"+0%":"$10,000")+'</text>');
    [["var(--eq)",0],["var(--bond)",1],["var(--cash)",2]].forEach(function(p){
      var ey=Y(sv(p[1],i1));
      S.push('<circle cx="'+X(END).toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="4.5" fill="'+p[0]+'"/>');
      S.push('<text class="series-end" x="'+(X(END)+12)+'" y="'+(ey+4).toFixed(1)+'" fill="'+p[0]+'">'+disp(sv(p[1],i1))+'</text>');
    });

    // legend
    var lg=[["U.S. stocks &mdash; S&amp;P 500 price","var(--eq)"],["U.S. bonds &mdash; IG / Bloomberg U.S. Agg","var(--bond)"],["Cash &mdash; 30-day T-bills","var(--cash)"]];
    var lx=pL,ly=22;
    lg.forEach(function(it){
      S.push('<line x1="'+lx+'" y1="'+ly+'" x2="'+(lx+22)+'" y2="'+ly+'" stroke="'+it[1]+'" stroke-width="3"/>');
      S.push('<text class="ax-strong" x="'+(lx+30)+'" y="'+(ly+4)+'">'+it[0]+'</text>');
      lx+=30+it[0].replace(/&[a-z]+;/g,'x').length*6.7+30;
    });

    // ---- events: keep a roughly CONSTANT count on screen at every zoom level ----
    // Show the ~TARGET most important events inside the window; a short window then
    // surfaces smaller events to fill the same quota (zoom in -> more detail).
    var TARGET = span>55 ? 15 : 17;
    var inWin = events.filter(function(e){return e[0]>=curDomain[0]-0.02 && e[0]<=END+0.02;})
                      .sort(function(a,b){return a[0]-b[0];});
    var vis;
    if(inWin.length<=TARGET){ vis=inWin.slice(); }
    else {
      var byTier={}; inWin.forEach(function(e){(byTier[e[5]]=byTier[e[5]]||[]).push(e);});
      vis=[];
      for(var tr=1;tr<=4 && vis.length<TARGET;tr++){
        var grp=byTier[tr]||[];
        if(vis.length+grp.length<=TARGET){ vis=vis.concat(grp); }
        else{
          var need=TARGET-vis.length, seen={};
          for(var j=0;j<need;j++){
            var ix=need>1?Math.round(j*(grp.length-1)/(need-1)):Math.floor(grp.length/2);
            while(seen[ix])ix=(ix+1)%grp.length;
            seen[ix]=1; vis.push(grp[ix]);
          }
        }
      }
      vis.sort(function(a,b){return a[0]-b[0];});
    }
    var placed=[], layer=[];
    function ov(a,b){return !(a.x1<b.x0||a.x0>b.x1||a.y1<b.y0||a.y0>b.y1);}
    vis.sort(function(a,b){return a[0]-b[0];}).forEach(function(e){
      var ex=X(e[0]), ay=Y(eqAnchor(e[0]));
      var tw=Math.max(e[1].replace(/&[a-z]+;/g,'xx').length,e[2].length)*6.05;
      var left = ex+26+tw > pR-6;
      var tx = left ? ex-15-tw : ex+15;
      var b0=Math.min(ex-13,tx-5), b1=Math.max(ex+13,tx+tw+5);
      var iy=ay-42;
      for(var k=0;k<90;k++){var bb={x0:b0-3,x1:b1+3,y0:iy-13,y1:iy+15};
        if(!placed.some(function(p){return ov(bb,p);}))break; iy-=25;}
      iy=Math.max(iy,pT+12);
      placed.push({x0:b0-3,x1:b1+3,y0:iy-13,y1:iy+15});
      var col=toneCol[e[3]];
      layer.push('<line x1="'+ex.toFixed(1)+'" y1="'+(iy+12).toFixed(1)+'" x2="'+ex.toFixed(1)+'" y2="'+(ay-4).toFixed(1)+'" stroke="'+col+'" stroke-width="1" stroke-opacity="0.30"/>');
      layer.push('<circle cx="'+ex.toFixed(1)+'" cy="'+ay.toFixed(1)+'" r="3.3" fill="'+col+'" stroke="var(--panel)" stroke-width="1.4"/>');
      layer.push('<rect x="'+b0.toFixed(1)+'" y="'+(iy-14).toFixed(1)+'" width="'+(b1-b0).toFixed(1)+'" height="29" rx="4" fill="var(--halo)" fill-opacity="0.95"/>');
      layer.push('<text class="evt-label" x="'+tx.toFixed(1)+'" y="'+(iy-1).toFixed(1)+'">'+e[1]+'</text>');
      layer.push('<text class="evt-date" x="'+tx.toFixed(1)+'" y="'+(iy+12).toFixed(1)+'">'+e[2]+'</text>');
      layer.push('<circle cx="'+ex.toFixed(1)+'" cy="'+iy.toFixed(1)+'" r="11" fill="var(--halo)"/>');
      layer.push('<circle cx="'+ex.toFixed(1)+'" cy="'+iy.toFixed(1)+'" r="11" fill="'+col+'" fill-opacity="0.14" stroke="'+col+'" stroke-width="1.3"/>');
      layer.push(iconSVG(e[4],col,ex,iy));
    });
    S.push(layer.join(""));
    S.push('<g id="hover"></g>');
    S.push('<rect id="hitbox" x="'+pL+'" y="'+pT+'" width="'+(pR-pL)+'" height="'+(pB-pT)+'" fill="transparent"/>');

    svg.innerHTML=S.join("");

    // sub line + event count note
    var cnt=vis.length;
    document.getElementById("sub").innerHTML = f.k==="Max"
      ? "$10,000 invested when the S&amp;P 500 began in 1957 &mdash; "+cnt+" defining events marked"
      : "Zoomed to the last "+f.k+" &mdash; "+cnt+" events (about the same count at every zoom; smaller events appear as you look closer)";
  }

  /* ============ HOVER / CROSSHAIR ============================ */
  var pt=svg.createSVGPoint(), lastC={cx:0,cy:0};
  function localX(evt){
    var cx=(evt.touches?evt.touches[0].clientX:evt.clientX);
    var cy=(evt.touches?evt.touches[0].clientY:evt.clientY);
    lastC.cx=cx; lastC.cy=cy;
    pt.x=cx; pt.y=cy;
    var m=svg.getScreenCTM(); if(!m)return null;
    return pt.matrixTransform(m.inverse()).x;
  }
  function moveHover(evt){
    var x=localX(evt); if(x==null)return;
    x=Math.max(pL,Math.min(pR,x));
    var t=curDomain[0]+(x-pL)/(pR-pL)*(curDomain[1]-curDomain[0]);
    var i=idxAt(t); if(i<curI0)i=curI0; var tx=curX(times[i]);
    var g=svg.querySelector("#hover"); if(!g)return;
    var rows=[[EQ,curSc[0],"var(--eq)"],[BO,curSc[1],"var(--bond)"],[CA,curSc[2],"var(--cash)"]];
    var h='<line class="cross" x1="'+tx.toFixed(1)+'" y1="'+pT+'" x2="'+tx.toFixed(1)+'" y2="'+pB+'"/>';
    rows.forEach(function(r){h+='<circle cx="'+tx.toFixed(1)+'" cy="'+curY(r[0][i]*r[1]).toFixed(1)+'" r="4.5" fill="'+r[2]+'" stroke="var(--panel)" stroke-width="1.5"/>';});
    // date pill pinned on the x-axis
    var dlab=fmtDate(times[i]), dw=dlab.length*7.2+18;
    var dx=Math.max(pL+dw/2, Math.min(pR-dw/2, tx));
    h+='<rect x="'+(dx-dw/2).toFixed(1)+'" y="'+(pB+6)+'" width="'+dw.toFixed(1)+'" height="20" rx="4" fill="var(--ink)"/>'
      +'<text x="'+dx.toFixed(1)+'" y="'+(pB+20)+'" text-anchor="middle" fill="var(--panel)" font-size="12" font-weight="600" font-family="Libre Franklin,sans-serif">'+dlab+'</text>';
    g.innerHTML=h;
    tip.className="tip on";
    tip.innerHTML='<div class="td">'+dlab+(state.rebase?' &middot; since '+fmtDate(times[curI0]):'')+'</div>'
      +'<div class="tr"><span><i class="dot" style="background:var(--eq)"></i>Stocks</span><b>'+dispG(EQ[i]*curSc[0])+'</b></div>'
      +'<div class="tr"><span><i class="dot" style="background:var(--bond)"></i>Bonds</span><b>'+dispG(BO[i]*curSc[1])+'</b></div>'
      +'<div class="tr"><span><i class="dot" style="background:var(--cash)"></i>Cash</span><b>'+dispG(CA[i]*curSc[2])+'</b></div>';
    // tooltip follows the cursor
    var r=svg.getBoundingClientRect();
    var mx=lastC.cx-r.left, my=lastC.cy-r.top;
    var tw=tip.offsetWidth, th=tip.offsetHeight;
    var lx = mx+18; if(lx+tw>r.width-4) lx=mx-tw-18; if(lx<4)lx=4;
    var ly = my+18; if(ly+th>r.height-4) ly=my-th-18; if(ly<4)ly=4;
    tip.style.left=lx+"px"; tip.style.top=ly+"px";
  }
  function endHover(){var g=svg.querySelector("#hover"); if(g)g.innerHTML=""; tip.className="tip";}
  svg.addEventListener("mousemove",moveHover);
  svg.addEventListener("mouseleave",endHover);
  svg.addEventListener("touchstart",moveHover,{passive:true});
  svg.addEventListener("touchmove",moveHover,{passive:true});
  svg.addEventListener("touchend",endHover);

  var rt; window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(render,150);});
  render();

  /* ============ FOOTNOTE ==================================== */
  document.getElementById("foot").innerHTML=
    '<strong>How to read this.</strong> Illustrative growth of a single $10,000 investment made when the S&amp;P 500 launched (year-end 1957) and held through Sep 1, 2026, on a <strong>ratio (log) scale</strong>. '
    +'Use the time-frame buttons to zoom; the y-axis rescales to the visible window and <strong>more market events appear the further you zoom in</strong> (major events always shown, secondary and minor events revealed in shorter windows). Hover or tap the chart for values on any date. '
    +'Stocks are the S&amp;P 500 <strong>price index</strong> (39.99 &rarr; 7,631.47), price return only. Bonds and cash are <strong>total return</strong>, compounded year by year from published annual returns: bonds splice Ibbotson U.S. government bonds (1958&ndash;1975) into the Bloomberg U.S. Aggregate (1976&ndash;present); cash is 30-day U.S. Treasury bills. Because stocks exclude dividends while bonds and cash include income, the equity line understates stocks&rsquo; true lead. Past performance is not indicative of future results. '
    +'<br>Sources: S&amp;P Dow Jones Indices; Bloomberg Index Services; Ibbotson / Morningstar SBBI; U.S. Treasury; Federal Reserve (FRED). Annual-return figures are approximate. Data verified Sep 2026.';
})();
</script>
</body>
