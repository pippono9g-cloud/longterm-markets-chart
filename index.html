<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stocks, Bonds &amp; Cash Since 1957</title>
<style>
  /* House theme — matches the Thailand Fund Risk-Return / Fund-flow / Performance dashboards */
  :root{
    --scb:#4F2D7F; --scb-l:#EFE9F7; --scb-d:#3a2160;
    --ground:#ffffff; --panel:#ffffff;
    --ink:#1a1a1a; --ink-soft:#4d4d4d; --ink-mute:#666666;
    --grid:#e5e5e5; --hair:#cccccc; --soft:#f2f2f2;
    --eq:#4F2D7F; --eq-fill:#4F2D7F; --bond:#B45309; --cash:#007BB0;
    --shock:#b91c1c; --policy:#475569; --milestone:#047857;
    --halo:#ffffff;
  }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);margin:0;
    font-family:Arial,Helvetica,"Segoe UI","Noto Sans Thai",sans-serif;
    font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1500px;margin:0 auto;padding:24px 24px 52px}
  .title-bar{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;
    padding:14px 16px 12px;border-radius:12px;margin-bottom:16px;
    background:#fff;border:1px solid var(--hair);border-bottom:2px solid var(--scb)}
  .arrow{flex:none;margin-top:10px;width:0;height:0;
    border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:15px solid var(--scb)}
  .tt{flex:1;min-width:260px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);margin:0 0 4px}
  h1{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:0}
  .sub{font-size:13px;font-weight:700;color:var(--scb);margin:4px 0 0}
  .card{border:1px solid var(--hair);border-radius:12px;padding:16px 18px 18px;
    box-shadow:0 1px 3px rgba(79,45,127,.06)}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 4px}
  .controls .lbl{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-mute);margin-right:2px}
  .tf-btn{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-soft);background:#fff;
    border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;transition:.12s}
  .tf-btn:hover{background:var(--soft);color:var(--ink)}
  .tf-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .tf-btn:focus-visible{outline:2px solid var(--scb);outline-offset:2px}
  .tf-btn:disabled{opacity:.38;cursor:not-allowed}
  .tf-btn.switch{padding:3px 4px;display:inline-flex;gap:3px;align-items:center;background:var(--soft);border-color:var(--ink)}
  .tf-btn.switch b,.tf-btn.switch span{padding:3px 11px;border-radius:999px;font-size:12.5px;line-height:1.35;font-weight:700}
  .tf-btn.switch b{background:var(--ink);color:#fff}
  .tf-btn.switch span{color:var(--ink-mute);font-weight:600}
  .yr-in{font:inherit;font-size:12.5px;font-weight:700;width:56px;text-align:center;color:var(--ink);
    border:1.5px solid var(--ink);border-radius:8px;padding:4px 6px;background:#fff}
  .yr-in::placeholder{color:var(--ink-mute);font-weight:400}
  .yr-in:focus-visible{outline:2px solid var(--scb);outline-offset:1px}
  .controls .dash{color:var(--ink-mute);font-weight:700;margin:0 -2px}
  figure{margin:12px 0 0;position:relative;touch-action:none}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:none;cursor:crosshair;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  svg.dragging{cursor:grabbing}
  .chart-scroll{overflow:hidden;touch-action:none}
  .foot{margin:14px 0 0;font-size:11.5px;line-height:1.55;color:var(--ink-mute);border-top:1px solid var(--hair);padding-top:11px}
  .foot strong{color:var(--ink-soft);font-weight:700}
  text{font-family:Arial,Helvetica,"Noto Sans Thai",sans-serif}
  .ax{fill:var(--ink-mute);font-size:12px;font-weight:400}
  .ax-strong{fill:var(--ink-soft);font-size:12px;font-weight:700}
  .gridline{stroke:var(--grid);stroke-width:1}
  .gridline.minor{stroke-dasharray:2 3;opacity:.6}
  .baseline{stroke:var(--ink-soft);stroke-width:1.4}
  .evt-label{fill:var(--ink);font-size:12px;font-weight:700}
  .evt-date{fill:var(--ink-mute);font-size:11px;font-weight:400}
  .series-end{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .cross{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <div class="title-bar">
    <span class="arrow"></span>
    <div class="tt">
      <p class="eyebrow">1957 &ndash; 2026 &nbsp;&bull;&nbsp; U.S. dollars &nbsp;&bull;&nbsp; growth of a single $10,000 investment</p>
      <h1>Stocks, bonds &amp; cash over the long run</h1>
      <p class="sub" id="sub">$10,000 invested when the S&amp;P 500 began in 1957, held through every crisis since</p>
    </div>
  </div>

  <div class="card">
    <div class="controls" id="controls">
      <span class="lbl">Time frame</span>
    </div>

    <figure>
      <div class="chart-scroll">
        <svg id="chart" viewBox="0 0 1760 780" role="img"
             aria-label="Interactive logarithmic chart of $10,000 invested in U.S. stocks, bonds and cash since 1957, with adjustable time frame and event annotations that reveal more detail when zoomed in."></svg>
      </div>
    </figure>

    <p class="foot" id="foot"></p>
  </div>
</div>

      layer.push('<rect x="'+b0.toFixed(1)+'" y="'+(iy-14).toFixed(1)+'" width="'+(b1-b0).toFixed(1)+'" height="29" rx="4" fill="var(--halo)" fill-opacity="0.95"/>');
      layer.push('<text class="evt-label" x="'+tx.toFixed(1)+'" y="'+(iy-1).toFixed(1)+'">'+e[1]+'</text>');
      layer.push('<text class="evt-date" x="'+tx.toFixed(1)+'" y="'+(iy+12).toFixed(1)+'">'+e[2]+'</text>');
      layer.push('<circle cx="'+ex.toFixed(1)+'" cy="'+iy.toFixed(1)+'" r="11" fill="var(--halo)"/>');
      layer.push('<circle cx="'+ex.toFixed(1)+'" cy="'+iy.toFixed(1)+'" r="11" fill="'+col+'" fill-opacity="0.14" stroke="'+col+'" stroke-width="1.3"/>');
      layer.push(iconSVG(e[4],col,ex,iy));
    });
    S.push(layer.join(""));
    }  // end if(!fast)
    svg.innerHTML='<g id="scene">'+S.join("")+'</g><g id="hover"></g>';
    scene=svg.firstElementChild;

    syncYearInputs();
    if(fast) return;
    // sub line + event count note
    var cnt=vis.length, full=curDomain[0]<=START+0.05 && curDomain[1]>=END-0.05;
    document.getElementById("sub").innerHTML = full
      ? "$10,000 invested when the S&amp;P 500 began in 1957 &mdash; "+cnt+" defining events marked"
      : fmtDate(curDomain[0])+" &ndash; "+fmtDate(curDomain[1])+" &mdash; "+cnt+" event"+(cnt===1?"":"s")+" in view (scroll-wheel or drag to explore; type a year range above)";
  }

  /* ============ HOVER / CROSSHAIR ============================ */
  var pt=svg.createSVGPoint(), lastC={cx:0,cy:0};
  function localX(evt){
    var cx=(evt.touches?evt.touches[0].clientX:evt.clientX);
    var cy=(evt.touches?evt.touches[0].clientY:evt.clientY);
    lastC.cx=cx; lastC.cy=cy;
    pt.x=cx; pt.y=cy;
    var m=svg.getScreenCTM(); if(!m)return null;
    return pt.matrixTransform(m.inverse()).x;
  }
  function moveHover(evt){
    if(drag.on) return;
    var x=localX(evt); if(x==null)return;
    x=Math.max(pL,Math.min(pR,x));
    var t=curDomain[0]+(x-pL)/(pR-pL)*(curDomain[1]-curDomain[0]);
    var i=idxAt(t); if(i<curI0)i=curI0; var tx=curX(times[i]);
    var g=svg.querySelector("#hover"); if(!g)return;

    var h=['<line class="cross" x1="'+tx.toFixed(1)+'" y1="'+pT+'" x2="'+tx.toFixed(1)+'" y2="'+pB+'"/>'];
    var vs=[
      {v:EQ[i]*curSc[0],col:"var(--eq)"},
      {v:BO[i]*curSc[1],col:"var(--bond)"},
      {v:CA[i]*curSc[2],col:"var(--cash)"}
    ];
    vs.forEach(function(o){ o.y0=curY(o.v); o.y=o.y0; o.txt=dispG(o.v); });
    // dots sit exactly on each asset line
    vs.forEach(function(o){ h.push('<circle cx="'+tx.toFixed(1)+'" cy="'+o.y0.toFixed(1)+'" r="4.5" fill="'+o.col+'" stroke="var(--panel)" stroke-width="1.5"/>'); });
    // value labels ride on the lines (nudge apart only if they'd overlap)
    vs.slice().sort(function(a,b){return a.y0-b.y0;}).forEach(function(o,k,arr){ if(k && o.y-arr[k-1].y<16) o.y=arr[k-1].y+16; });
    var left = tx > pR-150;
    vs.forEach(function(o){
      var w=o.txt.length*7.3+14, y=Math.max(pT+9,Math.min(pB-9,o.y));
      var px=left ? tx-9-w : tx+9;
      h.push('<line x1="'+tx.toFixed(1)+'" y1="'+o.y0.toFixed(1)+'" x2="'+(left?px+w:px).toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+o.col+'" stroke-width="1" stroke-opacity="0.45"/>');
      h.push('<rect x="'+px.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" width="'+w.toFixed(1)+'" height="18" rx="3" fill="var(--panel)" stroke="'+o.col+'" stroke-width="1.2"/>');
      h.push('<text x="'+(px+w/2).toFixed(1)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="middle" fill="'+o.col+'" font-size="11.5" font-weight="700" font-family="Arial,Helvetica,sans-serif">'+o.txt+'</text>');
    });
    // date pill pinned on the x-axis
    var dlab=fmtDate(times[i]), dw=dlab.length*7.2+18;
    var dpx=Math.max(pL+dw/2, Math.min(pR-dw/2, tx));
    h.push('<rect x="'+(dpx-dw/2).toFixed(1)+'" y="'+(pB+6)+'" width="'+dw.toFixed(1)+'" height="20" rx="4" fill="var(--ink)"/>');
    h.push('<text x="'+dpx.toFixed(1)+'" y="'+(pB+20)+'" text-anchor="middle" fill="var(--panel)" font-size="12" font-weight="600" font-family="Arial,Helvetica,sans-serif">'+dlab+'</text>');
    g.innerHTML=h.join("");
  }
  function endHover(){var g=svg.querySelector("#hover"); if(g)g.innerHTML="";}
  hit.addEventListener("mousemove",moveHover);
  hit.addEventListener("mouseleave",endHover);

  // ---- touch: 1 finger = read / pan · 2 fingers = pinch-zoom · double-tap = zoom in ----
  var tch={x:0,y:0,mode:0,dom0:null,pd0:0,pcy:null,lastTap:0};  // mode 0 undecided,1 read,2 pan,3 pinch,9 dbltap
  function tdist(e){var a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
  function clientToFrac(cx){
    pt.x=cx; pt.y=0; var m=svg.getScreenCTM(); if(!m)return 0.5;
    return Math.max(0, Math.min(1, (pt.matrixTransform(m.inverse()).x - pL)/(pR-pL)));
  }
  function clientToYear(cx){
    var d=curDomain||state.dom;
    return d[0] + clientToFrac(cx)*(d[1]-d[0]);
  }
  function zoomAbout(tc,nsp,d0){
    var o=d0[1]-d0[0];
    nsp=Math.max(MINSPAN, Math.min(END-START, nsp));
    var n0=tc-(tc-d0[0])*(nsp/o), n1=n0+nsp;
    if(n0<START){n0=START;n1=START+nsp;}
    if(n1>END){n1=END;n0=END-nsp;}
    state.dom=[n0,n1];
  }
  // Block Safari's whole-page pinch-zoom so our touch handlers own the gesture.
  ["gesturestart","gesturechange","gestureend"].forEach(function(ev){
    hit.addEventListener(ev,function(e){e.preventDefault();},{passive:false});
  });

  // Photos-style pinch: during the gesture we just apply a GPU transform to <g id="scene">
  // (no re-draw at all), then re-render once, crisp, when the fingers lift.
  var gest=null;
  function pinchInit(e){
    tch.mode=3;
    var mx=(e.touches[0].clientX+e.touches[1].clientX)/2,
        my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    var m=svg.getScreenCTM(), vb;
    if(m){ pt.x=mx; pt.y=my; vb=pt.matrixTransform(m.inverse()); } else { vb={x:W/2,y:H/2}; }
    gest={ d0:tdist(e)||1, mx0:mx, my0:my, ox:vb.x, oy:vb.y,
           dom0:state.dom.slice(), rw:(svg.getBoundingClientRect().width||1),
           s:1, tx:0, ty:0 };
    endHover();
  }
  function applyGest(e){
    var d=tdist(e)||1, s=d/gest.d0;
    if(Math.abs(s-1) < 0.06) s=1;      // small distance change = a slide -> pure pan, no phantom zoom
    var mx=(e.touches[0].clientX+e.touches[1].clientX)/2,
        my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    var k=W/gest.rw;
    gest.s=s;
    gest.tx=(mx-gest.mx0)*k;
    gest.ty=(s===1)?0:(my-gest.my0)*k;  // don't drift vertically while purely panning
    scene.setAttribute("transform",
      "translate("+gest.tx.toFixed(2)+" "+gest.ty.toFixed(2)+") "+
      "translate("+gest.ox.toFixed(2)+" "+gest.oy.toFixed(2)+") "+
      "scale("+s.toFixed(4)+") "+
      "translate("+(-gest.ox).toFixed(2)+" "+(-gest.oy).toFixed(2)+")");
  }
  function commitGest(){
    if(!gest) return;
    var oldSpan=gest.dom0[1]-gest.dom0[0];
    var sp=Math.max(MINSPAN, Math.min(END-START, oldSpan/gest.s));
    // pre-transform viewBox-x that now sits at the plot's left edge:
    var xAtPL=(pL - gest.tx - gest.ox)/gest.s + gest.ox;
    var n0=gest.dom0[0] + (xAtPL - pL)/(pR-pL)*oldSpan;
    n0=Math.max(START, Math.min(END-sp, n0));
    state.dom=[n0, n0+sp];
    scene.removeAttribute("transform");
    gest=null; tch.mode=0;
    syncFrButtons(); render(false);
  }
  hit.addEventListener("touchstart",function(e){
    if(e.touches.length>=2){
      e.preventDefault();
      pinchInit(e);
    }else{
      tch.mode=0; tch.x=e.touches[0].clientX; tch.y=e.touches[0].clientY;
      var now=Date.now();
      if(now-tch.lastTap<300){
        e.preventDefault();
        tch.mode=9;                                    // double-tap = zoom OUT (widen the window)
        zoomAbout(clientToYear(e.touches[0].clientX)||((state.dom[0]+state.dom[1])/2), (state.dom[1]-state.dom[0])*2.2, state.dom.slice());
        syncFrButtons(); render();
      } else {
        moveHover(e);   // tap = show the value readout right away
      }
      tch.lastTap=now;
    }
  },{passive:false});
  hit.addEventListener("touchmove",function(e){
    if(tch.mode===9) return;
    if(e.touches.length>=2){
      e.preventDefault();
      if(tch.mode!==3 || !gest) pinchInit(e);   // works even if 1 finger was already resting
      applyGest(e);                             // pure GPU transform - no re-draw
      return;
    }
    if(e.touches.length!==1 || gest) return;
    e.preventDefault();
    moveHover(e);                               // one finger = scrub the readout
  },{passive:false});
  hit.addEventListener("touchend",function(e){
    if(e.touches.length===0){
      if(gest) commitGest();                    // fingers up after a pinch -> bake it in, redraw crisp
      tch.mode=0;
    } else if(e.touches.length===1 && gest){
      commitGest();                             // dropped to one finger -> finish the pinch now
    }
  },{passive:true});

  /* ---- drag to pan left / right ---- */
  var drag={on:false,x0:0,dom0:null,moved:false};
  function panFrom(clientX){
    var sp=drag.dom0[1]-drag.dom0[0];
    var dx=clientX-drag.x0;
    var r=svg.getBoundingClientRect();
    var dyr=-(dx/r.width)*(W/(pR-pL))*sp;      // pixels -> years, account for plot inset
    var n0=drag.dom0[0]+dyr, n1=drag.dom0[1]+dyr;
    if(n0<START){n1+=START-n0;n0=START;}
    if(n1>END){n0-=n1-END;n1=END;}
    state.dom=[n0,n1];
  }
  hit.addEventListener("mousedown",function(evt){
    if(evt.button!==0)return;
    evt.preventDefault();
    drag.on=true; drag.moved=false; drag.x0=evt.clientX; drag.dom0=state.dom.slice();
    endHover();
  });
  hit.addEventListener("dragstart",function(e){e.preventDefault();});
  window.addEventListener("mousemove",function(evt){
    if(!drag.on)return;
    if(Math.abs(evt.clientX-drag.x0)>3){drag.moved=true; svg.classList.add("dragging");}
    if(drag.moved){ panFrom(evt.clientX); scheduleRender(true); }
  });
  window.addEventListener("mouseup",function(){
    if(!drag.on)return;
    drag.on=false; svg.classList.remove("dragging");
  });

  /* ---- wheel: vertical = zoom about cursor · horizontal (or Shift) = pan ---- */
  var wheelRAF=0, fullTimer=0, pendFast=false;
  function scheduleRender(fast){
    if(fast) pendFast=true;
    if(!wheelRAF) wheelRAF=requestAnimationFrame(function(){
      wheelRAF=0; var f=pendFast; pendFast=false; syncFrButtons(); render(f);
    });
    if(fast){                                   // once motion stops, do one full (with events)
      clearTimeout(fullTimer);
      fullTimer=setTimeout(function(){ syncFrButtons(); render(false); }, 170);
    }
  }
  function panByPx(px){
    var rw=svg.getBoundingClientRect().width||W, sp=state.dom[1]-state.dom[0];
    var dyr=(px/rw)*(W/(pR-pL))*sp;
    var n0=state.dom[0]+dyr, n1=state.dom[1]+dyr;
    if(n0<START){n1+=START-n0;n0=START;}
    if(n1>END){n0-=n1-END;n1=END;}
    state.dom=[n0,n1];
  }
  hit.addEventListener("wheel",function(evt){
    evt.preventDefault();
    var dx=evt.deltaX||0, dy=evt.deltaY||0;
    if(evt.shiftKey && !dx){ dx=dy; dy=0; }              // Shift+wheel pans
    if(Math.abs(dx) > Math.abs(dy)){                     // trackpad horizontal swipe -> pan
      if(Math.abs(dx)<0.5) return;
      panByPx(dx); scheduleRender(true); return;
    }
    if(Math.abs(dy)<1) return;
    var x=localX(evt); if(x==null)return;
    x=Math.max(pL,Math.min(pR,x));
    var d0=state.dom[0], d1=state.dom[1], sp=d1-d0;
    var tc=d0+(x-pL)/(pR-pL)*sp;
    var nsp=Math.max(MINSPAN, Math.min(END-START, sp*Math.pow(1.0016,dy)));
    var n0=tc-(tc-d0)*(nsp/sp), n1=n0+nsp;
    if(n0<START){ n0=START; n1=START+nsp; }
    if(n1>END){ n1=END; n0=END-nsp; }
    state.dom=[n0,n1];
    scheduleRender(true);
  },{passive:false});

  var rt; window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(render,150);});
  syncFrButtons(); render();

  /* ============ FOOTNOTE ==================================== */
  document.getElementById("foot").innerHTML=
    '<strong>How to read this.</strong> Illustrative growth of a single $10,000 investment made when the S&amp;P 500 launched (year-end 1957) and held through Sep 1, 2026, on a <strong>ratio (log) scale</strong>. '
    +'Zoom with the time-frame buttons or the mouse wheel (about the cursor); pan by dragging (desktop). On a touch screen: one finger reads the values, two fingers pinch to zoom / slide to pan, double-tap zooms out. The y-axis rescales to the visible window, and a roughly <strong>constant number of events stays on screen at every zoom level</strong> &mdash; drawn from a curated importance-ranked index of ~150 market events (at least one per year) (default '+DEFAULT_EVENT_COUNT+' on screen), most significant first, with finer detail filling in as you zoom into a period. Hover or tap the chart to read each asset&rsquo;s value on its own line. '
    +'Stocks are the S&amp;P 500 <strong>monthly price</strong> (40.33 in Dec 1957 &rarr; 7,711 in Aug 2026), price return only. Cash is the 3-month U.S. Treasury-bill rate, compounded monthly. Bonds are the U.S. investment-grade aggregate: from Sep 2003 the <strong>actual monthly total return of the AGG ETF</strong>; before that, modelled from the 10-year Treasury yield and <strong>calibrated to the published annual return for each year</strong> (so 2008, 2013 and the &minus;13% of 2022 are the real figures). Because stocks exclude dividends while bonds and cash include income, the equity line understates stocks&rsquo; true lead. Past performance is not indicative of future results. '
    +'<br>Sources: S&amp;P Dow Jones Indices / R. Shiller (S&amp;P 500 monthly); FRED (TB3MS, GS10); iShares / Yahoo Finance (AGG total return); annual bond returns from Ibbotson / Morningstar. Monthly data through Aug 2026.';
})();
</script>
</body>
</html>
